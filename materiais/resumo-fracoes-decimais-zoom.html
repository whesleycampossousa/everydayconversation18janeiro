<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<title>Operações com Frações e Decimais — Zoom</title>
<style>html,body{margin:0;width:100%;height:100%;background:#0b1f3a;color:white;font-family:system-ui,sans-serif}.loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.loading strong{font-size:24px}</style>
</head>
<body>
<div class="loading"><div><strong>Carregando o resumo…</strong><br>Zoom por pinça habilitado.</div></div>
<script>
(async()=>{
  const raw='https://raw.githubusercontent.com/whesleycampossousa/everydayconversation18janeiro/main/materiais/resumo-fracoes-decimais-2026-09-17.html';
  try{
    let html=await (await fetch(raw,{cache:'no-store'})).text();
    html=html.replace(/<meta name="viewport"[^>]*>/,'<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">');
    const extra=`<style>
      .slides{touch-action:none!important}
      .zoom-live{position:fixed;right:14px;top:14px;z-index:9999;background:rgba(4,14,27,.9);color:#fff;border-radius:999px;padding:9px 13px;font:900 14px/1 system-ui,sans-serif;pointer-events:none;box-shadow:0 5px 18px rgba(0,0,0,.25)}
    </style>
    <script>
    (()=>{
      const slides=document.getElementById('slides');
      if(!slides) return;
      const prev=document.getElementById('prev'), next=document.getElementById('next'), zi=document.getElementById('zoomIn'), zo=document.getElementById('zoomOut');
      const badge=document.createElement('div'); badge.className='zoom-live'; badge.textContent='Zoom 100%'; document.body.appendChild(badge);
      let z=1,px=0,py=0,lastTap=0; const pts=new Map(); let g=null;
      const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
      const currentSheet=()=>{const c=document.getElementById('counter');const n=c?parseInt(c.textContent,10)-1:0;return document.querySelectorAll('.slide')[Math.max(0,n)]?.querySelector('.sheet');};
      const bounds=()=>{const s=currentSheet(); if(!s) return {mx:0,my:0}; const r=s.getBoundingClientRect(); const bw=r.width/Math.max(z,.001),bh=r.height/Math.max(z,.001); return {mx:Math.max(0,bw*(z-1)/2),my:Math.max(0,bh*(z-1)/2)};};
      function apply(anim=false){const s=currentSheet(); if(!s)return; const b=bounds();px=clamp(px,-b.mx,b.mx);py=clamp(py,-b.my,b.my);s.style.transition=anim?'transform .18s ease':'none';s.style.transform='translate3d('+px+'px,'+py+'px,0) scale('+z+')';badge.textContent='Zoom '+Math.round(z*100)+'%';}
      function reset(anim=true){z=1;px=0;py=0;document.querySelectorAll('.sheet').forEach(s=>{s.style.transform='';s.style.transition='';});badge.textContent='Zoom 100%';if(anim)apply(true);}
      function setZoom(n){z=clamp(n,1,3);if(z===1){px=0;py=0;}apply(false);}
      if(zi)zi.onclick=()=>setZoom(z+.2); if(zo)zo.onclick=()=>setZoom(z-.2);
      [prev,next].forEach(b=>b&&b.addEventListener('click',()=>reset(false),true));
      const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), ctr=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
      slides.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{slides.setPointerCapture(e.pointerId)}catch(_){};if(pts.size===1)g={type:z>1?'pan':'swipe',sx:e.clientX,sy:e.clientY,px,py};else if(pts.size===2){const [a,b]=[...pts.values()];g={type:'pinch',d:dist(a,b),z,px,py,c:ctr(a,b)};}e.preventDefault();e.stopImmediatePropagation();},{passive:false,capture:true});
      slides.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;if(g?.type==='pinch'&&pts.size>=2){const [a,b]=[...pts.values()].slice(0,2),c=ctr(a,b);z=clamp(g.z*(dist(a,b)/Math.max(1,g.d)),1,3);px=g.px+(c.x-g.c.x);py=g.py+(c.y-g.c.y);apply(false);}else if(g?.type==='pan'&&z>1){px=g.px+(e.clientX-g.sx);py=g.py+(e.clientY-g.sy);apply(false);}e.preventDefault();e.stopImmediatePropagation();},{passive:false,capture:true});
      function end(e){const gg=g;pts.delete(e.pointerId);if(pts.size===0){if(gg?.type==='swipe'&&z===1){const dx=e.clientX-gg.sx,dy=e.clientY-gg.sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3){(dx<0?next:prev)?.click();}else{const now=Date.now();if(Math.hypot(dx,dy)<12){if(now-lastTap<320){reset(true);lastTap=0;}else lastTap=now;}}}g=null;apply(true);}else if(pts.size===1){const p=[...pts.values()][0];g={type:z>1?'pan':'swipe',sx:p.x,sy:p.y,px,py};}e.preventDefault();e.stopImmediatePropagation();}
      slides.addEventListener('pointerup',end,{passive:false,capture:true});slides.addEventListener('pointercancel',end,{passive:false,capture:true});
      ['touchstart','touchmove','touchend'].forEach(t=>slides.addEventListener(t,e=>{e.preventDefault();e.stopImmediatePropagation();},{passive:false,capture:true}));
      badge.addEventListener('dblclick',()=>reset(true));
    })();
    <\/script>`;
    html=html.replace('</head>',extra+'</head>');
    document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<div class="loading"><div><strong>Não foi possível carregar.</strong><br>Atualize a página e tente novamente.</div></div>';}
})();
</script>
</body>
</html>
